<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña - ULima</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS Personalizado -->
    <link rel="stylesheet" href="/assets/css/login.css">
</head>

<body class="d-flex align-items-center justify-content-center py-5">

    <div class="card login-card shadow-lg border-0 rounded-0"
         style="max-width: 420px; width: 100%;">

        <div class="card-body p-4">

            <!-- LOGO -->
            <div class="my-3 px-4 text-center">
                <img src="assets/img/ul.png"
                     alt="Universidad de Lima"
                     class="img-fluid">
            </div>

            <!-- TÍTULO -->
            <div class="text-center mt-4 mb-4">
                <h4 class="fw-bold">Recuperar contraseña</h4>

                <p class="small text-muted mb-0">
                    Ingresa tu correo electrónico para recibir
                    las instrucciones para recuperar tu contraseña.
                </p>
            </div>

            <!-- FORMULARIO -->
            <form id="resetPasswordForm">

                <div class="mb-3">
                    <label for="txtEmail" class="form-label text-start w-100 fw-semibold">
                        Correo electrónico
                    </label>

                    <input type="email"
                           class="form-control rounded-1 p-3"
                           id="txtEmail"
                           name="email"
                           placeholder="Ingrese su correo electrónico"
                           autocomplete="email"
                           required>
                </div>

                <button type="submit"
                        class="btn btn-dark-custom w-100 p-3 fw-semibold mb-3">
                    Enviar instrucciones
                </button>

                <!-- VOLVER AL LOGIN -->
                <div class="text-center">
                    <a href="login2.html"
                       class="text-decoration-underline small text-dark">
                        Volver al inicio de sesión
                    </a>
                </div>

            </form>

    </div>

</body>
</html>
